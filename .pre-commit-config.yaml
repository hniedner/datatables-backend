# Install with `uv run pre-commit install` (installs the pre-commit, commit-msg, pre-push and post-checkout hooks).
# Tools that are Python packages run through `uv run --frozen`, so uv.lock pins them.
default_install_hook_types: [pre-commit, commit-msg, pre-push, post-checkout]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge] # otherwise it checks only during a merge
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--enforce-all] # otherwise it checks only files being added
        exclude: ^uv\.lock$ # generated, and already near the 500 KB limit; it grows with every dependency

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uv run --frozen actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: zizmor
        entry: uv run --frozen zizmor --offline
        language: system
        files: ^\.github/
        types: [yaml]
      # The word list lives outside the repository (DTB_PRIVATE_WORDS names it); without it the hooks fail closed.
      # CI has no list and skips these hooks by id.
      - id: private-words
        name: private-word scan (files)
        entry: uv run --frozen python scripts/private_word_scan.py
        language: system
        types: [] # the default [file] is ANDed with types_or, and a symlink is tagged `symlink` only
        types_or: [file, symlink]
      - id: private-words-message
        name: private-word scan (commit message)
        entry: uv run --frozen python scripts/private_word_scan.py --message
        language: system
        stages: [commit-msg]
      # A push that only adds a ref (a new branch or tag at an existing commit) brings no commit, so pre-commit runs
      # no pre-push hook for it. A word in a local ref name or tag fails every commit, and every checkout:
      # `git switch -c NAME` exits non-zero, so `git switch -c NAME && git push` stops before the push. Git cannot
      # undo the checkout itself. Still unscanned: `git branch NAME` or `git tag` followed straight by a push, with
      # no commit or checkout between, and a push to a remote ref no local ref holds (`git push origin HEAD:NAME`)
      # that brings no new commit. With a new commit, the pre-push hook below scans that remote ref name too.
      - id: private-words-refs
        name: private-word scan (local ref names and tags)
        entry: uv run --frozen python scripts/private_word_scan.py --refs
        language: system
        stages: [pre-commit, post-checkout]
        always_run: true
        pass_filenames: false
      # Before a push: everything the push publishes, including ref names, authors, commits made by a rebase or
      # cherry-pick, which skip the commit-stage hooks, and merge results, whose files no commit-stage hook scans.
      # It reads every reflog entry too, since pre-commit names only the first pushed ref with new commits; the remote
      # names of the second and later refs in one push are not passed, so not scanned. An old reflog entry holding a
      # word blocks pushes until `git reflog expire --expire-unreachable=now --all` drops it.
      - id: private-words-history
        name: private-word scan (everything a push publishes)
        entry: uv run --frozen python scripts/private_word_scan.py --history
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
