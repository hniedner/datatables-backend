# Install with `uv run pre-commit install` (installs the pre-commit, commit-msg and pre-push hooks below).
# Tools that are Python packages run through `uv run --frozen`, so uv.lock pins them.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge] # otherwise it checks only during a merge
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--enforce-all] # otherwise it checks only files being added

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uv run --frozen actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: zizmor
        entry: uv run --frozen zizmor --offline
        language: system
        files: ^\.github/
        types: [yaml]
      # The word list lives outside the repository (DTB_PRIVATE_WORDS names it); without it the hooks fail closed.
      # CI has no list and skips these hooks by id.
      - id: private-words
        name: private-word scan (files)
        entry: uv run --frozen python scripts/private_word_scan.py
        language: system
        types_or: [file, symlink]
      - id: private-words-message
        name: private-word scan (commit message)
        entry: uv run --frozen python scripts/private_word_scan.py --message
        language: system
        stages: [commit-msg]
      # On every commit, whatever is staged: a push that only adds a ref (a new branch at an existing commit)
      # brings no commit, so pre-commit runs no pre-push hook for it; a word in a local ref name or tag fails here.
      - id: private-words-refs
        name: private-word scan (local ref names and tags)
        entry: uv run --frozen python scripts/private_word_scan.py --refs
        language: system
        always_run: true
        pass_filenames: false
      # Before a push: everything the push publishes, including ref names, authors, and commits made by a rebase,
      # cherry-pick or merge, which skip the two hooks above.
      - id: private-words-history
        name: private-word scan (everything a push publishes)
        entry: uv run --frozen python scripts/private_word_scan.py --history
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
