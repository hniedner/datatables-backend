[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datatables-backend"
description = "Server-side processing for DataTables from SQL (SQLAlchemy 2, async and sync) and OpenSearch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "R. Hannes Niedner" }]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = ["pydantic>=2.10"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0.30"]
opensearch = ["opensearch-py>=2.6"]
fastapi = ["fastapi>=0.133", "python-multipart>=0.0.9"]

[project.urls]
Homepage = "https://github.com/hniedner/datatables-backend"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "basedpyright>=1.29",
    "fastapi>=0.133",
    "httpx2>=2.16",
    "opensearch-py[async]>=2.6",
    "pytest>=8.3",
    "python-multipart>=0.0.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "sqlalchemy[asyncio]>=2.0.30",
    "starlette>=1.2",
]

[tool.hatch.version]
path = "src/datatables_backend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datatables_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "RUF", "C4", "B", "A", "SIM", "ARG", "PL", "PERF", "S", "FURB", "T20"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "N815", "N818", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["datatables_backend"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
