[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datatables-backend"
description = "Server-side processing for DataTables from SQL (SQLAlchemy 2, async and sync) and OpenSearch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "R. Hannes Niedner" }]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.10",
    "pydantic>=2.12; python_version >= '3.14'",
    "pydantic>=2.14; python_version >= '3.15'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0.31"]
# Async SQL also needs an async driver of the database's own (aiosqlite, asyncpg, aiomysql, aioodbc).
sqlalchemy-async = ["sqlalchemy[asyncio]>=2.0.31"]
opensearch = ["opensearch-py>=2.6"]
opensearch-async = ["opensearch-py[async]>=2.6"]
fastapi = ["fastapi>=0.133", "python-multipart>=0.0.9"]

[project.urls]
Homepage = "https://github.com/hniedner/datatables-backend"
Documentation = "https://github.com/hniedner/datatables-backend#readme"
Issues = "https://github.com/hniedner/datatables-backend/issues"
Changelog = "https://github.com/hniedner/datatables-backend/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12",
    "aiosqlite>=0.20",
    "basedpyright>=1.29",
    "diff-cover>=11",
    "fastapi>=0.133",
    "httpx2>=2.16",
    "hypothesis>=6.100",
    "opensearch-py[async]>=2.6",
    "pre-commit>=4.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "sqlalchemy[asyncio]>=2.0.31",
    "starlette>=1.2",
    "zizmor>=1.32",
]
# The drivers for the container tests (tests/conftest.py, DTB_SQL_URL): one implementation per database for sync and
# async alike. SQL Server also needs Microsoft's ODBC Driver 18 on the machine.
containers = [
    "aiomysql>=0.2",
    "aioodbc>=0.5",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "pyodbc>=5.2",
]
# mysqlclient (sync MySQL driver) builds from source on Linux and macOS, so it is a group of its own.
mysqlclient = [
    "mysqlclient>=2.2",
]

[tool.hatch.version]
path = "src/datatables_backend/__init__.py"

# Without a list the sdist takes every file .gitignore does not exclude, tracked or not. scripts/check_dist.py checks
# the built sdist.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/datatables_backend"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "RUF", "C4", "B", "A", "SIM", "ARG", "PL", "PERF", "S", "FURB", "T20"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "N815", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "E501", "PLC0415"]
"scripts/trace_check.py" = ["T201"]
"scripts/private_word_scan.py" = ["S603", "S607", "T201"]
"scripts/check_dist.py" = ["S603", "S607", "T201"]
"scripts/test_*.py" = ["S101", "S603"]
"scripts/test_private_word_scan.py" = ["S607"]
"scripts/test_check_dist.py" = ["S607"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["datatables_backend"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
failOnWarnings = true

[tool.coverage.run]
# The word-scan tests run the script as a subprocess, as its hooks do; this measures those runs too.
patch = ["subprocess"]
# The changed-line gate measures the scripts, not their tests.
omit = ["*/scripts/test_*.py"]  # relative to each measured process's cwd, so a glob, not a path
