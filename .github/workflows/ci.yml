name: CI

# Throwaway branch: only the live OpenSearch legs, to run the measurements for issue 34. Never merged.
on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opensearch:
    name: opensearch (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.10.0'
            image: opensearchproject/opensearch:3.10.0@sha256:02d6d6e40c820ae08233b60540aa5d3d9364d64e2dc724e38d6c8c794879b2a0
          - version: '3.9.0'
            image: opensearchproject/opensearch:3.9.0@sha256:3bf4fe26aeb9f7b03c0ebcb1302bb24e855ee6b89fd926d26a71a83ef6f7e076
          - version: '3.8.0'
            image: opensearchproject/opensearch:3.8.0@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40
          - version: '3.7.0'
            image: opensearchproject/opensearch:3.7.0@sha256:44ba7ea58a319adf61c33ab16873f9ef5dbb30b291a832d375172f0b2d24e3c9
          - version: '3.6.0'
            image: opensearchproject/opensearch:3.6.0@sha256:b5dd1512af2a99748c942cfbbd7f32162623336b210667d0fc6333c6321f171d
          - version: '3.5.0'
            image: opensearchproject/opensearch:3.5.0@sha256:dbb01641baadae5104e18acd888bf05e8fdd9af3567fd30624a76ba3e5a31dec
          - version: '3.4.0'
            image: opensearchproject/opensearch:3.4.0@sha256:1647ce2e07371f1ac8bbad28890a64ef77c5a694a61f656120f0ace09e66bf48
          - version: '3.3.2'
            image: opensearchproject/opensearch:3.3.2@sha256:798cf28e226a32f5c928dd1ed9478dd3a33d2212176aad3679020088ad3afa1a
          - version: '3.2.0'
            image: opensearchproject/opensearch:3.2.0@sha256:23297b8d8545e129dd58c254ed08d786dc552410ba772983ad2af31048d2f04b
          - version: '3.1.0'
            image: opensearchproject/opensearch:3.1.0@sha256:474ea3fdf25d229e103018b14c8a0d5bb858113f919bc3f0652a3c2e98f16f1e
          - version: '3.0.0'
            image: opensearchproject/opensearch:3.0.0@sha256:00565f63fa1aa1643d5a2cf61cb5f09b4aeddee2f12703f01c534f051bff1a99
          - version: '2.19.7'
            image: opensearchproject/opensearch:2.19.7@sha256:d89333b6bd4a13b9a95aef7f373c0a6e73440f59bc0d8d1460f9b347289ed0ef
    services:
      opensearch:
        image: ${{ matrix.image }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
    env:
      DTB_OPENSEARCH_URL: http://localhost:9200
      DTB_REQUIRE_OPENSEARCH: '1'
      DTB_OPENSEARCH_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - name: Wait for the cluster
        run: |
          for _ in $(seq 90); do
            if curl -fsS "$DTB_OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=2s"; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: uv run --frozen pytest -v tests/test_opensearch_live.py
      - name: The source of main, to compare with
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: fa7de309812687aa4c0b8749b638c85e774cc06e
          path: main-src
      - name: Answers with main's source and with the branch's, and their diff
        if: always()
        run: |
          PYTHONPATH="$PWD/main-src/src" uv run --frozen python -m tools.compare_34 > "$RUNNER_TEMP/before.txt"
          uv run --frozen python -m tools.compare_34 > "$RUNNER_TEMP/after.txt"
          wc -l "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"
          echo "--- diff, main (<) against the branch (>):"
          diff "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" || true
          echo "--- end of diff"
      - name: Each character left unescaped in turn
        if: always()
        run: |
          uv run --frozen python -m tools.mutate_34 "$RUNNER_TEMP/mutated"
          PYTHONPATH="$RUNNER_TEMP/mutated" uv run --frozen python -m tools.mutate_34
