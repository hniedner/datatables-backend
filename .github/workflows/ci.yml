name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole workflow on the commit it is about to publish, and publishes what `dist` uploads.
  workflow_call:
    outputs:
      passed:
        description: "'true' once `gate` has seen every job succeed; empty otherwise."
        value: ${{ jobs.gate.outputs.passed }}

permissions:
  contents: read

# GitHub's `bash` shell runs with -eo pipefail, so a failing command inside a pipe fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python scripts/trace_check.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run --frozen basedpyright

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the coverage leg (3.14, as in the two `if:`s below) needs history: diff-cover compares with the base.
          fetch-depth: ${{ matrix.python == '3.14' && '0' || '1' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: The environment runs the matrix Python
        env:
          PY: ${{ matrix.python }}
        run: |
          uv run --frozen python - <<'EOF'
          import os, sys
          version = sys.version.split()[0]
          print('python', version)
          assert version.startswith(os.environ['PY'] + '.'), version
          EOF
      - if: matrix.python != '3.14'
        run: uv run --frozen pytest
      # One leg (3.14, named in both `if:`s and in fetch-depth above) measures line and branch coverage of the library
      # and scripts/ (the word scan's subprocess runs included): the total is reported, and the lines this change
      # touches must be 95 % covered. The change is the pull request against its base, or a push against the commit
      # before it.
      - name: Tests with branch coverage, then coverage of the changed lines
        if: matrix.python == '3.14'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          uv run --frozen pytest --cov=datatables_backend --cov=scripts --cov-branch --cov-report=xml --cov-report=term
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "This event names no base commit (a new branch or tag, or a manual run): comparing with HEAD~1."
            BASE=HEAD~1
          fi
          uv run --frozen diff-cover coverage.xml --compare-branch="$BASE" --fail-under=95
      # The coverage that leg wrote goes to Codecov for the README's badge. The upload cannot fail the build, and
      # Codecov's own statuses are informational (codecov.yml): diff-cover above is the one coverage gate.
      - name: Upload the coverage to Codecov
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  # Every pre-commit hook on every file, except the private-word scans, whose word list never leaves the owner's
  # machine. gitleaks' hook scans staged changes only, which here is nothing; the `secrets` job scans the history.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - env:
          SKIP: private-words,private-words-message,private-words-refs,private-words-history
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  # Every commit a pull request or a push to main brings, merge commits aside, has a conventional header (decision 009,
  # section 4): the commit-msg hook `commit-header` runs on each message by its id. This job also refuses what that hook
  # lets through for work in progress: `fixup!`, `squash!` and `amend!`, and on a commit that is not a merge a `Merge `
  # or `#` header. The range is the pull request's base..head, or the push's before..after; an event with no base
  # commit here (a new branch or tag, the release workflow's call on a tag, a manual run) checks the commits the head's
  # first parent lacks, as the coverage step falls back to HEAD~1. A header is printed after the commit's SHA with its
  # control characters (a carriage return included) replaced by `?`, so the runner cannot read it as a workflow
  # command. The hook sees only the first line, so a blank first line is refused and the comment skipping of the
  # hook stays a local convenience (an editor's comment lines never reach a stored message).
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Every commit of the change has a conventional header
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "This event names no base commit in this clone (a new branch or tag, a release, a manual run):"
            echo "checking $HEAD_SHA~1..$HEAD_SHA."
            BASE="$HEAD_SHA~1"
          fi
          shas=$(git rev-list --no-merges "$BASE..$HEAD_SHA")
          message="$RUNNER_TEMP/message"
          failed=0
          checked=0
          for sha in $shas; do
            checked=$((checked + 1))
            body=$(git log -1 --format=%B "$sha")
            header=${body%%$'\n'*}
            shown=${header//[[:cntrl:]]/?}
            printf '%s\n' "$header" > "$message"
            if [[ "$header" =~ ^(fixup!|squash!|amend!|Merge\ |#) ]]; then
              printf '%s: not for main (squash or reword it): %s\n' "$sha" "$shown"
              failed=1
            elif ! uv run --frozen pre-commit run commit-header --hook-stage commit-msg \
              --commit-msg-filename "$message"; then
              printf '%s: not a conventional header of at most 100 characters: %s\n' "$sha" "$shown"
              failed=1
            fi
          done
          echo "$checked commit(s) checked, $BASE..$HEAD_SHA"
          exit "$failed"

  # A pull request that changes `__version__` is a release pull request (a branch name is no sign: past ones were
  # `release/0.1.0rc3`, `release/0.1.0-prep` and `release/0.1.1`): its version must be git-cliff's for the commits it
  # releases and have a dated CHANGELOG section, as the tag run will check (scripts/check_release.py). Any other pull
  # request, and a push, is not checked. The `if:` is on the step, not the job, because `gate` fails on a skipped job.
  release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: A new version is git-cliff's, with a dated CHANGELOG section
        if: github.event_name == 'pull_request'
        # The merge ref's first parent is the base this merge was built on; the event's base.sha can be stale.
        run: |
          uv run --frozen --only-group release --python 3.14 python scripts/check_release.py pr "$(git rev-parse HEAD^1)"

  # gitleaks over every commit on every branch and tag. The pre-commit hook scans only what is staged, which in CI is
  # nothing; this job scans what a push publishes. The release binary is checked against its published SHA-256.
  # GITLEAKS_VERSION, GITLEAKS_SHA256 and the gitleaks rev in .pre-commit-config.yaml move together.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$archive" "$release/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .'

  # Installs the built wheel as a user would, outside the checkout. With only the leg's extra, the core modules and that
  # extra's module must import. With every extra and greenlet installed, importing them must not load a package another
  # extra requires directly (nor sqlalchemy.ext.asyncio on the sqlalchemy legs), which also catches such an import
  # guarded by try/except; a guarded import of a transitive dependency (e.g. starlette, urllib3) is not caught. The
  # extras and their direct requirements come from the wheel's metadata, and the matrix must list every declared extra.
  # An async extra's leg also runs what the extra is for: greenlet starts SQLAlchemy's asyncio module, aiohttp gives
  # opensearch-py its AsyncOpenSearch.
  install-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.15']
        extra: [core, sqlalchemy, sqlalchemy-async, opensearch, opensearch-async, fastapi]
    env:
      EXTRA: ${{ matrix.extra }}
      PY: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - name: Write the import check
        working-directory: ${{ runner.temp }}
        run: |
          cat > check.py <<'EOF'
          import importlib, os, re, sys
          from importlib.metadata import distribution, packages_distributions
          extra = os.environ['EXTRA']
          backend = extra.removesuffix('-async')  # an async extra adds packages to its backend's module
          modules = ('protocol', 'columns', '_plan', 'rows', 'cache')
          core = ['datatables_backend', *(f'datatables_backend.{m}' for m in modules)]
          for module in core if extra == 'core' else [*core, f'datatables_backend.{backend}']:
              importlib.import_module(module)
          assert sys.version.startswith(os.environ['PY'] + '.'), sys.version
          where = sys.modules['datatables_backend'].__file__
          assert 'site-packages' in where, where  # the installed wheel, not the checkout
          dist = distribution('datatables-backend')
          declared = set(dist.metadata.get_all('Provides-Extra') or [])
          def canon(name):
              return re.sub(r'[-_.]+', '-', name).lower()
          tops = {}
          for top, names in packages_distributions().items():
              for name in names:
                  tops.setdefault(canon(name), set()).add(top)
          def packages(of):  # the installed top-level packages of the requirements under extra `of` (None: the core's)
              found = set()
              for req in dist.requires or []:
                  marker = re.search(r'extra\s*==\s*["\']([^"\']+)', req)
                  if (marker.group(1) if marker else None) == of:
                      found |= tops.get(canon(re.match(r'[A-Za-z0-9._-]+', req).group()), set())
              return found
          own = packages(extra) if extra != 'core' else set()
          assert extra == 'core' or own, f'{extra}: its requirements map to no installed package'
          if os.environ.get('ALL_EXTRAS'):
              workflow = open(os.path.join(os.environ['GITHUB_WORKSPACE'], '.github/workflows/ci.yml')).read()
              legs = re.search(r'install-isolation:.*?extra: \[([^\]]*)\]', workflow, re.S).group(1)
              matrix = {leg.strip() for leg in legs.split(',')}
              assert matrix == declared | {'core'}, f'matrix {sorted(matrix)} != core + extras {sorted(declared)}'
              unmapped = sorted(e for e in declared if not packages(e))
              assert not unmapped, f'extras whose requirements map to no installed package: {unmapped}'
              absent = set().union(*(packages(e) for e in declared if e != extra)) - own - packages(None)
              if backend == 'sqlalchemy':
                  absent.add('sqlalchemy.ext.asyncio')
              assert absent, f'{extra}: nothing to check'
              loaded = sorted(absent & set(sys.modules))
              print(f'{extra}, every extra installed: loaded {loaded or "nothing"} of {sorted(absent)}')
              sys.exit(f'{extra} loaded {loaded}' if loaded else 0)
          for top in sorted(own):  # the extra's own packages import with only that extra installed
              importlib.import_module(top)
          if extra == 'sqlalchemy-async':  # greenlet came with the extra: the asyncio module starts
              import asyncio
              from sqlalchemy.ext.asyncio import AsyncSession
              from sqlalchemy.util import greenlet_spawn
              assert asyncio.run(greenlet_spawn(lambda: 1)) == 1
          if extra == 'opensearch-async':  # aiohttp came with the extra: the async client exists
              from opensearchpy import AsyncOpenSearch
          print(f'{extra} on {sys.version.split()[0]}, only its own extra installed: imports')
          EOF
      - name: Imports with only its own extra installed
        working-directory: ${{ runner.temp }}
        run: |
          wheel=$(ls dist/*.whl)
          uv venv -q -p "$PY" own
          if [ "$EXTRA" = core ]; then spec=$wheel; else spec="${wheel}[${EXTRA}]"; fi
          uv pip install -q -p own "$spec"
          own/bin/python check.py
      - name: Loads no other extra with every extra and greenlet installed
        working-directory: ${{ runner.temp }}
        run: |
          wheel=$(ls dist/*.whl)
          uv venv -q -p "$PY" all
          extras=$(unzip -p "$wheel" '*.dist-info/METADATA' | sed -n 's/^Provides-Extra: //p' | paste -sd, -)
          uv pip install -q -p all "${wheel}[${extras}]" greenlet
          ALL_EXTRAS=1 all/bin/python check.py

  # Builds the sdist, and the wheel from that sdist, as a release does, and uploads both. A release publishes these
  # two files (release.yml), so the job restores no cache. It checks nothing itself: the build backend and its
  # dependencies are installed unpinned and run in this job, so `dist-check` judges the files from a job they never
  # ran in.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # Checks the two files `dist` uploaded, the same artefact a release publishes, against a fresh checkout of the same
  # commit: scripts/check_dist.py compares their names, metadata, members and contents with what git holds, and the
  # wheel must install into an empty environment and import from there. Nothing here builds the project, so the
  # build backend does not run in this job.
  dist-check:
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: uv run --no-project --python 3.14 python scripts/check_dist.py dist dist
      # check_dist.py has tied the wheel's file name to the version in the source; here the installed metadata and
      # `__version__` must both be the version in that name.
      - name: The wheel installs into an empty environment and imports from there
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
        run: |
          wheel=$(ls "$DIST"/*.whl)
          uv venv -q -p 3.14 clean
          uv pip install -q -p clean "$wheel"
          WHEEL="$wheel" clean/bin/python - <<'EOF'
          from importlib.metadata import version
          import os
          from pathlib import Path
          import datatables_backend
          where = datatables_backend.__file__
          assert 'site-packages' in where, where  # the installed wheel, not the checkout
          stated = version('datatables-backend')
          assert datatables_backend.__version__ == stated, (datatables_backend.__version__, stated)
          wheel = Path(os.environ['WHEEL']).name
          assert wheel == f'datatables_backend-{stated}-py3-none-any.whl', (wheel, stated)
          print(f'{wheel}: installed, imports from {where}, version {stated}')
          EOF

  # Resolves outside uv.lock on purpose: the lowest supported sqlalchemy, pydantic and extras on each Python, with the
  # rest of the dev group resolved to match them. The 3.12 and 3.15 legs also force starlette 0.40.0, the lowest that
  # fastapi 0.133 allows, as an override (the dev group's starlette>=1.2 is test tooling), plus httpx, which that
  # TestClient needs.
  # It does not use `uv run --with ... pytest`: the project's `pytest` script runs the project interpreter, which does
  # not see the --with overlay (seen with uv 0.13.7 in a fresh checkout). This job uses an explicit environment, checked
  # with `uv pip check`, and asserts its versions.
  minimum-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            pins: sqlalchemy==2.0.31 pydantic==2.10.0 fastapi==0.133.0 python-multipart==0.0.9 opensearch-py==2.6.0
            overrides: starlette==0.40.0
            tools: httpx
          - python: '3.13'
            pins: sqlalchemy==2.0.31 pydantic==2.10.0 fastapi==0.133.0 python-multipart==0.0.9 opensearch-py==2.6.0
          - python: '3.14'
            pins: sqlalchemy==2.0.31 pydantic==2.12.0 fastapi==0.133.0 python-multipart==0.0.9 opensearch-py==2.6.0
          - python: '3.15'
            pins: sqlalchemy==2.0.31 pydantic==2.14.0 fastapi==0.133.0 python-multipart==0.0.9 opensearch-py==2.6.0
            overrides: starlette==0.40.0
            tools: httpx
    env:
      MIN_PINS: ${{ matrix.pins }}
      MIN_OVERRIDES: ${{ matrix.overrides }}
      MIN_TOOLS: ${{ matrix.tools }}
      MIN_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv venv -p "$MIN_PYTHON" .venv-min
      # The `release` group: scripts/test_cliff_config.py needs git-cliff. Outside the lock it resolves to the newest
      # version, as the rest of `dev` does here.
      - run: |
          read -ra pins <<< "$MIN_PINS $MIN_TOOLS"
          read -ra overrides <<< "$MIN_OVERRIDES"
          printf '%s\n' "${overrides[@]}" > "$RUNNER_TEMP/overrides.txt"
          uv pip install -p .venv-min --override "$RUNNER_TEMP/overrides.txt" -e . --group dev --group release \
            "${pins[@]}"
      - run: uv pip check -p .venv-min
      - name: The pins equal the floors pyproject.toml declares for this Python
        run: |
          .venv-min/bin/python - <<'EOF'
          import os, sys, tomllib
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version
          project = tomllib.load(open('pyproject.toml', 'rb'))['project']
          declared = [*project['dependencies'], *(r for rs in project['optional-dependencies'].values() for r in rs)]
          env = {'python_version': os.environ['MIN_PYTHON']}
          floors: dict[str, Version] = {}
          for req in map(Requirement, declared):
              if req.marker and not req.marker.evaluate(env):
                  continue
              for spec in req.specifier:
                  if spec.operator == '>=':
                      name = canonicalize_name(req.name)
                      floors[name] = max(floors.get(name, Version(spec.version)), Version(spec.version))
          pins = {canonicalize_name(n): Version(v) for n, v in (p.split('==') for p in os.environ['MIN_PINS'].split())}
          problems = [f'{n}: pinned {pins.get(n)}, floor {f}' for n, f in sorted(floors.items()) if pins.get(n) != f]
          problems += [f'{n}: pinned but declares no floor' for n in sorted(pins) if n not in floors]
          print('\n'.join(problems) or f'every pin equals its declared floor: {sorted(floors)}')
          sys.exit(1 if problems else 0)
          EOF
      - name: Show and assert the installed minimum versions
        run: |
          .venv-min/bin/python - <<'EOF'
          from importlib.metadata import version
          import os, sys
          print('python', sys.version.split()[0], 'starlette', version('starlette'))
          assert sys.version.startswith(os.environ['MIN_PYTHON'] + '.'), sys.version
          for pin in (os.environ['MIN_PINS'] + ' ' + os.environ['MIN_OVERRIDES']).split():
              name, wanted = pin.split('==')
              print(name, version(name))
              assert version(name) == wanted, f'{name} {version(name)} != {wanted}'
          EOF
      - run: .venv-min/bin/python -m pytest

  # The behaviour suite against real databases (tests/conftest.py reads DTB_SQL_URL and DTB_SQL_ASYNC_URL). The
  # report header names the server and its version, and DTB_SQL_DIALECT makes a test fail if the run fell back to
  # SQLite. Images are pinned by digest; the passwords are for these throwaway containers only.
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        env:
          POSTGRES_PASSWORD: dtb-test-only
          POSTGRES_DB: dtb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d dtb" --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      DTB_SQL_URL: postgresql+psycopg://postgres:dtb-test-only@localhost:5432/dtb
      DTB_SQL_ASYNC_URL: postgresql+psycopg_async://postgres:dtb-test-only@localhost:5432/dtb
      DTB_SQL_DIALECT: postgresql
      # A session zone far from UTC (libpq reads PGTZ, for psycopg and psycopg_async alike): a date criterion on a
      # timestamptz column then fails unless its day bounds are UTC midnights.
      PGTZ: Pacific/Kiritimati
      # Python's local zone far from UTC too, on the other side: a bound built from local time (`.astimezone()`) would
      # pass on the UTC runner.
      TZ: America/Adak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --group containers
      - run: uv run --frozen pytest tests/test_sql.py tests/test_sql_search.py tests/test_reference_properties.py

  # The same server through the other PostgreSQL drivers SQLAlchemy documents: psycopg2 (sync) and asyncpg (async).
  postgresql-psycopg2-asyncpg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
        env:
          POSTGRES_PASSWORD: dtb-test-only
          POSTGRES_DB: dtb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d dtb" --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      DTB_SQL_URL: postgresql+psycopg2://postgres:dtb-test-only@localhost:5432/dtb
      DTB_SQL_ASYNC_URL: postgresql+asyncpg://postgres:dtb-test-only@localhost:5432/dtb
      DTB_SQL_DIALECT: postgresql
      # A session zone far from UTC, as on the psycopg leg (libpq reads PGTZ for psycopg2; whether asyncpg does is
      # unchecked): a date criterion on a timestamptz column then fails unless its day bounds are UTC midnights.
      PGTZ: Pacific/Kiritimati
      # Python's local zone far from UTC too, on the other side.
      TZ: America/Adak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --group containers
      - run: uv run --frozen pytest tests/test_sql.py tests/test_sql_search.py tests/test_reference_properties.py

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: dtb-test-only
          MYSQL_DATABASE: dtb
        ports: ['3306:3306']
        # TCP, not the socket: the server that initialises the data directory listens on the socket only
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -uroot -pdtb-test-only -e 'SELECT 1' dtb" --health-interval 2s
          --health-timeout 5s --health-retries 90
    env:
      DTB_SQL_URL: mysql+pymysql://root:dtb-test-only@127.0.0.1:3306/dtb
      DTB_SQL_ASYNC_URL: mysql+aiomysql://root:dtb-test-only@127.0.0.1:3306/dtb
      DTB_SQL_DIALECT: mysql
      # Python's local zone far from UTC: a bound built from local time (`.astimezone()`) would pass on the UTC runner.
      TZ: America/Adak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --group containers
      - run: uv run --frozen pytest tests/test_sql.py tests/test_sql_search.py tests/test_reference_properties.py

  # The same tests on MySQL 8.4 through mysqlclient, the C driver that most MySQL installations still use. Sync only:
  # mysqlclient has no async form, so the async half stays aiomysql. It builds from source, so it is a group of its own.
  mysql-mysqlclient:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: dtb-test-only
          MYSQL_DATABASE: dtb
        ports: ['3306:3306']
        # TCP, not the socket: the server that initialises the data directory listens on the socket only
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -uroot -pdtb-test-only -e 'SELECT 1' dtb" --health-interval 2s
          --health-timeout 5s --health-retries 90
    env:
      DTB_SQL_URL: mysql+mysqldb://root:dtb-test-only@127.0.0.1:3306/dtb
      DTB_SQL_ASYNC_URL: mysql+aiomysql://root:dtb-test-only@127.0.0.1:3306/dtb
      DTB_SQL_DIALECT: mysql
      # Python's local zone far from UTC, as on the mysql leg.
      TZ: America/Adak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config
      - run: uv sync --locked --group containers --group mysqlclient
      - run: uv run --frozen pytest tests/test_sql.py tests/test_sql_search.py tests/test_reference_properties.py

  # MariaDB 12.3, the current long-term support line (https://mariadb.org/about/#maintenance-policy), through the
  # same drivers as MySQL. The `mariadb+` URLs make SQLAlchemy name the dialect `mariadb`, which the library's
  # MariaDB branches and the tests key on. The `mariadb` connector is not run: SQLAlchemy has no async form of it.
  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.3@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
        env:
          MARIADB_ROOT_PASSWORD: dtb-test-only
          MARIADB_DATABASE: dtb
        ports: ['3306:3306']
        # The image's own script, over TCP once InnoDB is up: the initialising server listens on the socket only
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s
          --health-timeout 5s --health-retries 90
    env:
      DTB_SQL_URL: mariadb+pymysql://root:dtb-test-only@127.0.0.1:3306/dtb
      DTB_SQL_ASYNC_URL: mariadb+aiomysql://root:dtb-test-only@127.0.0.1:3306/dtb
      DTB_SQL_DIALECT: mariadb
      # Python's local zone far from UTC, as on the mysql leg.
      TZ: America/Adak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --group containers
      - run: uv run --frozen pytest tests/test_sql.py tests/test_sql_search.py tests/test_reference_properties.py

  sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        # MCR serves this tag as an OCI image manifest. Look its digest up with an Accept header that lists the OCI
        # types (application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, then Docker's),
        # and check that GET .../manifests/<digest> answers 200: a Docker-v2-only Accept gets a converted manifest
        # whose digest docker cannot pull.
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Dtb-test-only-1
        ports: ['1433:1433']
    env:
      DTB_SQL_URL: mssql+pyodbc://sa:Dtb-test-only-1@localhost:1433/dtb?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      DTB_SQL_ASYNC_URL: mssql+aioodbc://sa:Dtb-test-only-1@localhost:1433/dtb?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      DTB_SQL_DIALECT: mssql
      # Python's local zone far from UTC, as on the mysql leg.
      TZ: America/Adak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --group containers
      # The runner image has no ODBC driver: install Microsoft's from its signed apt repository.
      - name: Install Microsoft's ODBC Driver 18
        run: |
          curl -fsSL -o "$RUNNER_TEMP/packages-microsoft-prod.deb" \
            "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -q -y msodbcsql18 unixodbc
          odbcinst -q -d | grep -Fx '[ODBC Driver 18 for SQL Server]'
      - name: Wait for the server, then create the database
        run: |
          uv run --frozen python - <<'EOF'
          import time
          import pyodbc
          server = 'DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD=Dtb-test-only-1;TrustServerCertificate=yes'
          for _ in range(90):
              try:
                  connection = pyodbc.connect(server, autocommit=True, timeout=5)
                  break
              except pyodbc.Error:
                  time.sleep(2)
          else:
              raise SystemExit('SQL Server did not answer')
          connection.execute('CREATE DATABASE dtb')
          EOF
      - run: uv run --frozen pytest tests/test_sql.py tests/test_sql_search.py tests/test_reference_properties.py

  # The OpenSearch backend against a real cluster (tests/test_opensearch_live.py and tests/test_reference_opensearch.py
  # read DTB_OPENSEARCH_URL), once on each server line the library is tested on. Docker runs the digest and ignores
  # the tag beside it, so the two move together. These tracked places name a version a leg runs: docs/PRD.md (PRD-F9,
  # PRD-Q14), docs/decisions/001-opensearch-case-folding-beyond-ascii.md, spec/README.md (OQ4),
  # tests/test_opensearch_live.py, README.md and CLAUDE.md. Check them when a leg's version changes: several record a
  # measurement on that version, which holds for another one only once it is measured again.
  opensearch:
    name: opensearch (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.10.0'
            image: opensearchproject/opensearch:3.10.0@sha256:02d6d6e40c820ae08233b60540aa5d3d9364d64e2dc724e38d6c8c794879b2a0
          - version: '2.19.7'
            image: opensearchproject/opensearch:2.19.7@sha256:d89333b6bd4a13b9a95aef7f373c0a6e73440f59bc0d8d1460f9b347289ed0ef
    services:
      opensearch:
        image: ${{ matrix.image }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
    env:
      DTB_OPENSEARCH_URL: http://localhost:9200
      DTB_REQUIRE_OPENSEARCH: '1'  # without the URL the module fails instead of skipping every test
      DTB_OPENSEARCH_VERSION: ${{ matrix.version }}  # a test fails unless the server reports this version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - name: Wait for the cluster
        run: |
          for _ in $(seq 90); do
            if curl -fsS "$DTB_OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=2s"; then exit 0; fi
            sleep 2
          done
          exit 1
      # -v: the log names each test and its outcome on this leg's server.
      - run: uv run --frozen pytest -v tests/test_opensearch_live.py tests/test_reference_opensearch.py

  # The required status check on main. Runs even when a needed job failed, was cancelled or was skipped; passes only
  # if every needed job (every matrix leg included) succeeded.
  gate:
    if: always()
    needs:
      [lint, types, tests, pre-commit, commits, release-version, secrets, install-isolation, dist, dist-check,
       minimum-versions, postgresql, postgresql-psycopg2-asyncpg, mysql, mysql-mysqlclient, mariadb, sqlserver,
       opensearch]
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.passed.outputs.passed }}
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
      # Runs only when the step above succeeded. release.yml publishes only on this output.
      - id: passed
        run: echo "passed=true" >> "$GITHUB_OUTPUT"
