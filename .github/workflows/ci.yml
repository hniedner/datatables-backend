name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --frozen basedpyright

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --frozen pytest

  # Installs the package as a user would, with one extra and no dev group, and checks that the core modules and that
  # extra's module load no other extra (and no greenlet, which `sqlalchemy.ext.asyncio` needs).
  install-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [core, sqlalchemy, opensearch, fastapi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv venv -p 3.12 .venv-iso
      - run: uv pip install -p .venv-iso -e "${{ matrix.extra == 'core' && '.' || format('.[{0}]', matrix.extra) }}"
      - name: Import without loading other extras
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          .venv-iso/bin/python - <<'EOF'
          import importlib, os, sys
          extra = os.environ['EXTRA']
          core = ['datatables_backend', *(f'datatables_backend.{m}' for m in ('protocol', 'columns', '_plan', 'rows', 'cache'))]
          own = {'core': set(), 'sqlalchemy': {'sqlalchemy'}, 'opensearch': {'opensearchpy'}, 'fastapi': {'fastapi', 'starlette'}}[extra]
          for module in core if extra == 'core' else [*core, f'datatables_backend.{extra}']:
              importlib.import_module(module)
          leaked = sorted({'sqlalchemy', 'opensearchpy', 'fastapi', 'starlette', 'greenlet'} - own & {m.partition('.')[0] for m in sys.modules})
          print(f'{extra}: other extras loaded: {leaked or "none"}')
          sys.exit(f'{extra} loaded {leaked}' if leaked else 0)
          EOF

  # Resolves outside uv.lock on purpose: the lowest supported sqlalchemy, pydantic and extras on each Python, with the
  # rest of the dev group resolved to match them. The 3.12 leg also forces starlette 0.40.0, the lowest that fastapi
  # 0.133 allows, as an override (the dev group's starlette>=1.2 is test tooling), plus httpx, which that TestClient
  # needs.
  # It does not use `uv run --with ... pytest`: the project's `pytest` script runs the project interpreter, which does
  # not see the --with overlay (seen with uv 0.13.7 in a fresh checkout). This job uses an explicit environment, checked
  # with `uv pip check`, and asserts its versions.
  minimum-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            pins: sqlalchemy==2.0.31 pydantic==2.10.0 fastapi==0.133.0 python-multipart==0.0.9 opensearch-py==2.6.0
            overrides: starlette==0.40.0
            tools: httpx
          - python: '3.13'
            pins: sqlalchemy==2.0.31 pydantic==2.10.0 fastapi==0.133.0 python-multipart==0.0.9 opensearch-py==2.6.0
          - python: '3.14'
            pins: sqlalchemy==2.0.31 pydantic==2.12.0 fastapi==0.133.0 python-multipart==0.0.9 opensearch-py==2.6.0
    env:
      MIN_PINS: ${{ matrix.pins }}
      MIN_OVERRIDES: ${{ matrix.overrides }}
      MIN_TOOLS: ${{ matrix.tools }}
      MIN_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv venv -p "$MIN_PYTHON" .venv-min
      - run: |
          read -ra pins <<< "$MIN_PINS $MIN_TOOLS"
          read -ra overrides <<< "$MIN_OVERRIDES"
          printf '%s\n' "${overrides[@]}" > "$RUNNER_TEMP/overrides.txt"
          uv pip install -p .venv-min --override "$RUNNER_TEMP/overrides.txt" -e . --group dev "${pins[@]}"
      - run: uv pip check -p .venv-min
      - name: Show and assert the installed minimum versions
        run: |
          .venv-min/bin/python - <<'EOF'
          from importlib.metadata import version
          import os, sys
          print('python', sys.version.split()[0], 'starlette', version('starlette'))
          assert sys.version.startswith(os.environ['MIN_PYTHON'] + '.'), sys.version
          for pin in (os.environ['MIN_PINS'] + ' ' + os.environ['MIN_OVERRIDES']).split():
              name, wanted = pin.split('==')
              print(name, version(name))
              assert version(name) == wanted, f'{name} {version(name)} != {wanted}'
          EOF
      - run: .venv-min/bin/python -m pytest
