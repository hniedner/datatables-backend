name: CI

# Throwaway branch: only the live OpenSearch legs, to run the measurements for issue 14. Never merged.
on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opensearch:
    name: opensearch (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.10.0'
            image: opensearchproject/opensearch:3.10.0@sha256:02d6d6e40c820ae08233b60540aa5d3d9364d64e2dc724e38d6c8c794879b2a0
          - version: '2.19.7'
            image: opensearchproject/opensearch:2.19.7@sha256:d89333b6bd4a13b9a95aef7f373c0a6e73440f59bc0d8d1460f9b347289ed0ef
    services:
      opensearch:
        image: ${{ matrix.image }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
    env:
      DTB_OPENSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - name: Wait for the cluster
        run: |
          for _ in $(seq 90); do
            if curl -fsS "$DTB_OPENSEARCH_URL/_cluster/health?wait_for_status=yellow&timeout=2s"; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: The measurements for issue 14
        run: uv run --frozen python tools/measure_14.py
