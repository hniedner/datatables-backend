name: Scorecard

# OpenSSF Scorecard on the default branch, with its findings uploaded to code scanning (Security tab). It reports and
# gates nothing: it never runs on a pull request, so it cannot be a required check. The results are published to
# api.scorecard.dev (`publish_results: true`) for the README's badge, which is why the job has `id-token: write`: the
# publication is signed with the run's OIDC token. The owner reversed an earlier choice not to publish (issue #98).
on:
  # For the Branch-Protection check.
  branch_protection_rule:
  # Keeps the Maintained check current.
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Scorecard supports only the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write # upload the SARIF file to code scanning
      id-token: write # sign the published result with the run's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
